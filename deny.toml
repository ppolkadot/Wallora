[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false
no-default-features = false

[advisories]
yanked = "warn"
ignore = [
    # Transitive dependency of iced 0.14.0 -> image -> ravif -> rav1e; unmaintained with no upgrade available.
    { id = "RUSTSEC-2024-0436", reason = "Transitive dependency of iced 0.14.0 (rav1e -> paste); no upgrade available" },
    # Transitive dependency of iced 0.14.0 -> cosmic-text -> fontdb -> ttf-parser; unmaintained with no upgrade available.
    { id = "RUSTSEC-2026-0192", reason = "Transitive dependency of iced 0.14.0 (fontdb -> ttf-parser); no upgrade available" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
